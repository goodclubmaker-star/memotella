<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#75503a">
<meta name="description" content="말하면 한 권의 인생이 됩니다. 부모님의 목소리와 기억을 AI가 인터뷰하고 다듬어 가족 책으로 만드는 앱.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="메모텔라">
<link rel="manifest" href="manifest.json">
<title>메모텔라 — 말하면, 한 권의 인생이 됩니다</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 19px; }
  body { font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; background: #f8f2e8; color: #33271f; min-height: 100vh; line-height: 1.6; word-break: keep-all; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
  h1 { font-family: Georgia, "Noto Serif KR", serif; font-size: 1.5rem; text-align: center; padding-top: 8px; letter-spacing: -0.5px; color: #5d402f; }
  .sub { text-align: center; color: #9a7053; font-size: 0.9rem; margin-top: -8px; }
  .bigbtn { width: 100%; border: none; border-radius: 22px; cursor: pointer; font-size: clamp(26px, 7vw, 42px); font-weight: 800; line-height: 1.3; padding: 3vh 12px; color: #fff; font-family: inherit; box-shadow: 0 6px 0 rgba(82,55,36,0.28); }
  .bigbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(82,55,36,0.28); }
  .brown { background: #75503a; } .green { background: #1B7F3B; } .blue { background: #1250A6; } .red { background: #C62828; }
  .gray { background: #6b6258; font-size: clamp(18px, 4.6vw, 26px); padding: 1.9vh 12px; }
  .midbtn { font-size: clamp(17px, 4.5vw, 24px); padding: 1.6vh 12px; }
  .status { font-size: clamp(22px, 6vw, 34px); font-weight: 800; text-align: center; padding: 6px 4px; }
  .pulse { animation: pulse 1.2s infinite; color: #C62828; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .transcript { flex: 1; min-height: 16vh; background: #fffaf2; border: 3px solid #dfcfbb; border-radius: 16px; padding: 14px; font-size: clamp(21px, 5.6vw, 32px); line-height: 1.55; font-weight: 600; overflow-y: auto; white-space: pre-wrap; }
  .bigedit { width: 100%; min-height: 24vh; background: #fff; border: 3px solid #1250A6; border-radius: 16px; padding: 14px; font-size: clamp(21px, 5.6vw, 30px); line-height: 1.55; font-weight: 600; font-family: inherit; }
  .biginput { width: 100%; background: #fff; border: 3px solid #cbb99c; border-radius: 14px; padding: 12px; font-size: clamp(20px, 5.5vw, 28px); font-family: inherit; }
  .interim { color: #9a8564; }
  .qbox { background: #fdf0d2; border: 3px solid #c18b45; border-radius: 16px; padding: 14px; font-size: clamp(21px, 5.6vw, 30px); line-height: 1.45; font-weight: 700; color: #5d402f; }
  .hidden { display: none !important; }
  /* conversation feed */
  .daycount { text-align: center; font-size: 0.9rem; color: #9a7053; font-weight: 700; }
  .feed { display: flex; flex-direction: column; gap: 10px; max-height: 38vh; overflow-y: auto; padding: 2px; }
  .feed:empty { display: none; }
  .bub { max-width: 88%; padding: 11px 15px; border-radius: 18px; font-size: clamp(18px, 4.6vw, 24px); line-height: 1.5; box-shadow: 0 2px 6px rgba(78,52,34,0.07); }
  .bub .who { display: block; font-size: 0.72rem; font-weight: 800; opacity: 0.6; margin-bottom: 3px; }
  .bub.q { align-self: flex-start; background: #fdf0d2; border: 1px solid #e6c983; border-bottom-left-radius: 5px; color: #5d402f; }
  .bub.a { align-self: flex-end; background: #e6efe0; border: 1px solid #a7c9aa; border-bottom-right-radius: 5px; }
  .bub.thinking .dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #c18b45; margin: 0 3px; animation: blink 1.2s infinite; }
  .bub.thinking .dots i:nth-child(2) { animation-delay: 0.2s; }
  .bub.thinking .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.25; } 40% { opacity: 1; } }
  .card { background: #fffaf2; border: 1px solid #dfcfbb; border-radius: 16px; padding: 16px; box-shadow: 0 6px 20px rgba(78,52,34,0.06); }
  .card h3 { font-size: 1.05rem; color: #5d402f; margin-bottom: 6px; }
  .btn { font-size: 0.95rem; padding: 10px 14px; border-radius: 11px; border: 2px solid #b7a488; background: #fffaf2; font-family: inherit; cursor: pointer; color: #33271f; }
  .btn.primary { background: #75503a; color: #fff; border-color: #75503a; }
  .btn.warn { border-color: #C62828; color: #C62828; }
  .btn.small { font-size: 0.8rem; padding: 6px 9px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, textarea { font-size: 1rem; padding: 10px 12px; border-radius: 11px; border: 2px solid #cbb99c; background: #fff; font-family: inherit; width: 100%; }
  textarea { min-height: 120px; line-height: 1.6; }
  .chapter-head { display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #dfcfbb; padding: 14px 0 6px; }
  .chapter-head b { font-family: Georgia, "Noto Serif KR", serif; font-size: 1.25rem; color: #5d402f; }
  .chapter-head span { font-size: 0.8rem; color: #9a7053; }
  .story { border-bottom: 1px dashed #dfcfbb; padding: 12px 0; }
  .story .q { color: #1250A6; font-weight: 700; font-size: 0.92rem; }
  .story .period { color: #9a7053; font-size: 0.85rem; margin: 2px 0 6px; }
  .story .txt { white-space: pre-wrap; line-height: 1.65; }
  .story .polished-tag { display: inline-block; background: #dfe1d5; color: #45503a; font-size: 0.75rem; border-radius: 999px; padding: 2px 9px; margin-bottom: 4px; }
  .phrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .phrow .ph { position: relative; }
  .phrow img { height: 84px; border-radius: 10px; border: 1px solid #dfcfbb; }
  .phrow .ph button { position: absolute; top: -7px; right: -7px; background: #C62828; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; line-height: 1; }
  .compare { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
  .compare .pane { background: #fff; border: 2px solid #dfcfbb; border-radius: 12px; padding: 12px; white-space: pre-wrap; line-height: 1.65; font-size: 0.95rem; }
  .compare .pane.polish { border-color: #75503a; background: #fbf6ec; }
  .compare .pane b { display: block; color: #9a7053; font-size: 0.8rem; margin-bottom: 6px; }
  audio { width: 100%; margin-top: 8px; }
  .notice { background: #fdf0d2; border-radius: 12px; padding: 12px; font-size: 0.92rem; line-height: 1.5; }
  .homebtn { text-align: center; padding: 8px; }
  .homebtn button { background: none; border: none; color: #9a7053; font-size: 0.95rem; text-decoration: underline; font-family: inherit; cursor: pointer; padding: 8px; }
  .book { background: #fffdf8; border: 1px solid #dfcfbb; border-radius: 18px; padding: clamp(18px, 5vw, 48px); box-shadow: 0 10px 30px rgba(78,52,34,0.08); }
  .book .cover { text-align: center; padding: 8vh 0; border-bottom: 3px double #c18b45; margin-bottom: 26px; }
  .book .cover h2 { font-family: Georgia, "Noto Serif KR", serif; font-size: clamp(30px, 7vw, 46px); color: #5d402f; letter-spacing: -1px; }
  .book .cover p { color: #9a7053; margin-top: 10px; }
  .book h3 { font-family: Georgia, "Noto Serif KR", serif; font-size: 1.5rem; color: #5d402f; margin: 34px 0 12px; }
  .book .toc { background: #fbf6ec; border-radius: 12px; padding: 16px 20px; }
  .book .toc div { padding: 4px 0; border-bottom: 1px dotted #dfcfbb; display: flex; justify-content: space-between; font-size: 0.95rem; }
  .book .toc div:last-child { border-bottom: 0; }
  .book .piece { margin-bottom: 26px; overflow: hidden; }
  .book .piece .when { color: #9a7053; font-size: 0.85rem; margin-bottom: 4px; }
  .book .piece .body { white-space: pre-wrap; line-height: 1.85; font-size: 1.05rem; }
  .book .piece img { max-width: 100%; border-radius: 12px; margin: 10px 0; display: block; }
  .qrbox { float: right; margin: 0 0 8px 12px; text-align: center; background: #fff; border: 1px solid #dfcfbb; border-radius: 10px; padding: 8px; }
  .qrbox span { display: block; font-size: 0.7rem; color: #9a7053; margin-top: 4px; }
  .book .family { background: #fbf6ec; border-radius: 12px; padding: 14px; white-space: pre-wrap; font-size: 0.95rem; color: #584538; }
  .colophon { border-top: 3px double #c18b45; margin-top: 40px; padding-top: 20px; text-align: center; color: #9a7053; font-size: 0.85rem; }
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .book { border: none; box-shadow: none; border-radius: 0; }
    .wrap { max-width: none; padding: 0; }
    .book h3 { page-break-after: avoid; }
    .book .piece { page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  var API = 'https://kxvngoyvwtumdnczwyxs.supabase.co/functions/v1/mt/api';
  var app = document.getElementById('app');

  var SEEDS = [
    '어릴 적 살던 고향 집은 어떤 모습이었나요? 마당과 방이 어땠는지 말씀해 주세요.',
    '초등학교 때 담임 선생님이나 친구들 이름이 기억나세요? 그 시절 이야기를 들려주세요.',
    '어머니께서 해 주시던 음식 중에 제일 생각나는 것은 무엇인가요?',
    '첫 직장이나 첫 월급 받던 날이 기억나세요? 그날 무엇을 하셨나요?',
    '군대 시절 이야기를 하나 들려주세요. 어디서 복무하셨나요?',
    '배우자를 처음 만나셨을 때 이야기를 들려주세요. 첫인상이 어떠셨나요?',
    '아이들이 어렸을 때 기억에 남는 일이 있으세요?',
    '살면서 제일 자랑스러웠던 순간은 언제였나요?',
    '명절날 고향 집 풍경은 어땠나요? 무엇을 하고 지냈나요?',
    '지금 가족들에게 꼭 남기고 싶은 말씀이 있으세요?'
  ];

  function getCode(pid){ try { return localStorage.getItem('mtc:' + pid) || ''; } catch(e){ return ''; } }
  function setCode(pid, c){ try { localStorage.setItem('mtc:' + pid, c); } catch(e){} }
  function askCode(pid){
    var c = prompt('가족 코드 4자리를 입력하세요');
    if (c) { setCode(pid, c.trim()); return c.trim(); }
    return null;
  }
  function withCode(u, pid){ return API + u + (u.indexOf('?') > -1 ? '&' : '?') + 'code=' + encodeURIComponent(getCode(pid)); }

  function get(u, pid){ return fetch(withCode(u, pid)).then(function(r){ return r.json(); }); }
  function post(u, pid, body){ body = body || {}; body.code = getCode(pid); return fetch(API + u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r){ return r.json(); }); }
  function patch(u, pid, body){ return fetch(withCode(u, pid), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r){ return r.json(); }); }
  function del(u, pid){ return fetch(withCode(u, pid), { method: 'DELETE' }).then(function(r){ return r.json(); }); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ---- native: share ----
  function shareApp(title, text){
    var url = location.origin + location.pathname;
    if (navigator.share) {
      navigator.share({ title: title || '메모텔라', text: text || '말하면, 한 권의 인생이 됩니다', url: url }).catch(function(){});
    } else {
      try { navigator.clipboard.writeText(url); alert('주소가 복사되었습니다.\n' + url); }
      catch(e){ prompt('아래 주소를 복사해서 공유하세요', url); }
    }
  }
  // ---- native: notifications ----
  function enableNotify(){
    if (!('Notification' in window)) { alert('이 기기에서는 알림을 지원하지 않습니다.'); return; }
    Notification.requestPermission().then(function(p){
      if (p === 'granted') {
        try { localStorage.setItem('mt_notify', '1'); } catch(e){}
        new Notification('메모텔라', { body: '이제 이야기 기록 알림을 받아요. 오늘도 한 편 남겨보세요 🌾' });
      } else {
        alert('알림이 꺼져 있습니다. 휴대폰 설정에서 이 사이트의 알림을 허용해 주세요.');
      }
    });
  }
  function maybeRemind(){
    try {
      if (localStorage.getItem('mt_notify') !== '1') return;
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var last = parseInt(localStorage.getItem('mt_lastRemind') || '0');
      var now = Date.now();
      if (now - last > 20 * 3600 * 1000) {
        localStorage.setItem('mt_lastRemind', String(now));
        new Notification('메모텔라', { body: '오늘의 이야기를 한 편 들려주시겠어요? 🎙' });
      }
    } catch(e){}
  }

  function speak(text, cb){
    try { window.speechSynthesis.cancel(); } catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.92;
    var done = false;
    var fin = function(){ if (!done) { done = true; if (cb) cb(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1000 + text.length * 260);
    window.speechSynthesis.speak(u);
  }
  function stopSpeak(){ try { window.speechSynthesis.cancel(); } catch(e){} }

  function makeRec(cont){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    var r = new SR();
    r.lang = 'ko-KR'; r.continuous = cont; r.interimResults = true; r.maxAlternatives = 1;
    return r;
  }

  function route(){
    stopSpeak(); stopAll();
    var h = location.hash || '#home';
    var seg = h.slice(1).split('/');
    if (seg[0] === 'talk' && seg[1]) { if (seg[2]) setCode(seg[1], seg[2]); return renderTalk(seg[1]); }
    if (seg[0] === 'p' && seg[1]) return renderProject(seg[1]);
    if (seg[0] === 'book' && seg[1]) return renderBook(seg[1]);
    if (seg[0] === 'order' && seg[1]) return renderOrder(seg[1]);
    if (seg[0] === 'listen' && seg[1]) return renderListen(seg[1], seg[2] || '');
    if (seg[0] === 'admin') return renderAdmin();
    renderHome();
  }
  window.addEventListener('hashchange', route);

  function renderHome(){
    app.innerHTML =
      '<h1>🪶 메모텔라</h1><div class="sub">말하면, 한 권의 인생이 됩니다</div>' +
      '<div id="plist"><div class="notice">불러오는 중...</div></div>' +
      '<div class="card"><h3>새 인생책 시작하기</h3>' +
        '<div style="display:flex; flex-direction:column; gap:8px;">' +
        '<input id="npTitle" placeholder="책 제목 (예: 어머니의 이야기)">' +
        '<input id="npName" placeholder="주인공 성함 또는 호칭 (예: 어머니)">' +
        '<input id="npBirth" type="number" placeholder="주인공 출생 연도 (예: 1954)">' +
        '<button class="btn primary" id="npGo">만들기</button></div></div>';
    document.getElementById('npGo').onclick = function(){
      var t = document.getElementById('npTitle').value.trim();
      if (!t) { alert('책 제목을 입력해 주세요.'); return; }
      var by = parseInt(document.getElementById('npBirth').value);
      fetch(API + '/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: t, subject_name: document.getElementById('npName').value.trim(), birth_year: isNaN(by) ? undefined : by }) })
        .then(function(r){ return r.json(); })
        .then(function(r){
          if (!r.project) { alert(r.error || '실패'); return; }
          setCode(r.project.id, r.project.access_code);
          alert('이 책의 가족 코드는 [' + r.project.access_code + '] 입니다.\n가족에게만 알려주시고 꼭 적어두세요!');
          location.hash = '#p/' + r.project.id;
        });
    };
    fetch(API + '/projects').then(function(r){ return r.json(); }).then(function(r){
      var el = document.getElementById('plist');
      var ps = r.projects || [];
      if (!ps.length) { el.innerHTML = '<div class="notice">아직 만든 인생책이 없습니다. 아래에서 시작해 보세요.</div>'; return; }
      el.innerHTML = ps.map(function(p){
        return '<div class="card" style="margin-bottom:10px;"><h3>📖 ' + esc(p.title) + '</h3>' +
          '<div class="row" style="margin-top:8px;">' +
          '<button class="btn primary" onclick="location.hash=\'#talk/' + p.id + '\'">🎙 인터뷰 (어르신 화면)</button>' +
          '<button class="btn" onclick="location.hash=\'#p/' + p.id + '\'">📚 기록 관리 (가족용)</button>' +
          '<button class="btn" onclick="location.hash=\'#book/' + p.id + '\'">📕 웹책 보기</button>' +
          '<button class="btn" onclick="location.hash=\'#order/' + p.id + '\'">🎁 책 주문하기</button>' +
          '</div></div>';
      }).join('');
    });
    var tools = document.createElement('div');
    tools.className = 'card';
    tools.innerHTML = '<div class="row" style="justify-content:center;">' +
      '<button class="btn" id="hShare">📤 앱 공유하기</button>' +
      '<button class="btn" id="hNotify">🔔 알림 받기</button>' +
      '<button class="btn" onclick="location.hash=\'#admin\'">🛠 관리자</button></div>' +
      '<div style="text-align:center; color:#9a7053; font-size:0.8rem; margin-top:8px;">홈 화면에 추가하면 앱처럼 쓸 수 있어요</div>';
    app.appendChild(tools);
    document.getElementById('hShare').onclick = function(){ shareApp(); };
    document.getElementById('hNotify').onclick = function(){ enableNotify(); };
  }

  // ---------------- order (buyer) ----------------
  function renderOrder(pid){
    if (!getCode(pid)) { if (askCode(pid) === null) { location.hash = '#home'; return; } }
    app.innerHTML = '<h1>🎁 인생책 주문</h1>' +
      '<div class="notice">아버님·어머님의 이야기를 실제 책으로 만들어 가족에게 선물하세요. 주문을 남기시면 담당자가 연락드려 사양·금액·결제(계좌이체)를 안내하고 제작해 드립니다. <b>지금은 주문 접수 단계로, 이 화면에서 결제되지는 않습니다.</b></div>' +
      '<div id="oBody"><div class="notice">불러오는 중...</div></div>' +
      '<div class="homebtn no-print"><button onclick="location.hash=\'#p/' + pid + '\'">← 돌아가기</button></div>';
    get('/project?id=' + pid, pid).then(function(r){
      var title = (r && r.project) ? r.project.title : '';
      var count = (r && r.stories) ? r.stories.length : 0;
      document.getElementById('oBody').innerHTML =
        '<div class="card"><h3>📖 ' + esc(title) + '</h3>' +
        '<div style="color:#9a7053; font-size:0.9rem;">지금까지 담긴 이야기 ' + count + '편</div>' +
        '<div style="display:flex; flex-direction:column; gap:10px; margin-top:12px;">' +
        '<label>제본 방식<select id="oStyle"><option>양장(하드커버)</option><option>무선(소프트커버)</option><option>상담 후 결정</option></select></label>' +
        '<label>부수<input id="oCopies" type="number" min="1" value="10"></label>' +
        '<label>받으실 분 성함<input id="oName" placeholder="예: 채기웅"></label>' +
        '<label>연락처<input id="oPhone" placeholder="예: 010-0000-0000"></label>' +
        '<label>배송지<input id="oAddr" placeholder="주소 (선택)"></label>' +

  // ---------------- interview (elder) ----------------
  var T = { state: 'idle', rec: null, finalText: '', pending: '', question: '', asked: [], pid: null, subjectName: '나',
            media: null, recorder: null, chunks: [], audioBlob: null, periodTries: 0, wakeLock: null, typed: false,
            log: [], thinking: false };

  function stopAll(){
    if (T.rec) { try { T.rec.onend = null; T.rec.stop(); } catch(e){} T.rec = null; }
    if (T.recorder && T.recorder.state !== 'inactive') { try { T.recorder.stop(); } catch(e){} }
    if (T.media) { try { T.media.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} T.media = null; }
    T.recorder = null;
    if (T.wakeLock) { try { T.wakeLock.release(); } catch(e){} T.wakeLock = null; }
    T.state = 'idle';
  }
  function keepAwake(){
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function(wl){ T.wakeLock = wl; }).catch(function(){});
    }
  }

  function renderFeed(){
    var feed = document.getElementById('feed'); if (!feed) return;
    var html = T.log.map(function(m){
      if (m.role === 'q') return '<div class="bub q"><span class="who">❓ 질문</span>' + esc(m.text) + '</div>';
      return '<div class="bub a"><span class="who">🗣 ' + esc(T.subjectName || '나') + '</span>' + esc(m.text) + '</div>';
    }).join('');
    if (T.thinking) html += '<div class="bub q thinking"><span class="who">💭 다음 질문을 생각하고 있어요</span><span class="dots"><i></i><i></i><i></i></span></div>';
    feed.innerHTML = html;
    feed.scrollTop = feed.scrollHeight;
    var dc = document.getElementById('dcount');
    if (dc) {
      var n = T.log.filter(function(m){ return m.role === 'a'; }).length;
      dc.textContent = n > 0 ? '오늘 담은 이야기 ' + n + '개 · 계속 이어가요 🌾' : '오늘의 첫 이야기를 들려주세요';
    }
  }

  function renderTalk(pid){
    T.pid = pid; T.asked = []; T.log = []; T.thinking = false;
    if (!getCode(pid)) { if (askCode(pid) === null) { location.hash = '#home'; return; } }
    T.subjectName = '나';
    fetch(API + '/projects').then(function(r){ return r.json(); }).then(function(r){
      (r.projects || []).forEach(function(p){ if (p.id === pid && p.subject_name) T.subjectName = p.subject_name; });
    }).catch(function(){});
    app.innerHTML =
      '<h1>🎙 이야기 들려주세요</h1>' +
      '<div class="daycount" id="dcount"></div>' +
      '<div class="feed" id="feed"></div>' +
      '<div id="scr" style="display:flex; flex-direction:column; gap:12px; flex:1;"></div>' +
      '<div class="homebtn no-print"><button onclick="location.hash=\'#p/' + pid + '\'">가족용 화면으로</button></div>';
    talkIdle();
  }

  function talkIdle(msg){
    stopAll();
    renderFeed();
    var scr = document.getElementById('scr'); if (!scr) return;
    var greet = T.log.length ? '이어서 들려주시겠어요?' : (msg || '단추를 눌러 주세요');
    scr.innerHTML =
      '<div class="status">' + esc(greet) + '</div>' +
      '<button class="bigbtn green" id="tStart">🎤 이야기<br>시작하기</button>' +
      '<button class="bigbtn blue" id="tSeed">❓ 질문 듣고<br>이야기하기</button>' +
      '<button class="bigbtn gray midbtn" id="tType">⌨️ 글로 쓰기 (타자)</button>';
    document.getElementById('tStart').onclick = function(){ startTalk(null); };
    document.getElementById('tSeed').onclick = function(){ startTalk(SEEDS[Math.floor(Math.random() * SEEDS.length)]); };
    document.getElementById('tType').onclick = function(){ startTyping(null); };
  }

  function startTyping(question, preset){
    stopAll();
    T.typed = true; T.question = question || '';
    var scr = document.getElementById('scr');
    scr.innerHTML =
      (question ? '<div class="qbox">❓ ' + esc(question) + '</div>' : '<div class="status">글로 편하게 써 주세요</div>') +
      '<textarea class="bigedit" id="tyTxt" placeholder="여기에 이야기를 써 주세요"></textarea>' +
      '<input class="biginput" id="tyWhen" placeholder="언제쯤 일인가요? (예: 1965년, 열두 살 때)">' +
      '<button class="bigbtn red" id="tyDone">✅ 저장하기</button>' +
      '<button class="bigbtn gray" id="tyCancel">그만두기</button>';
    if (preset) document.getElementById('tyTxt').value = preset;
    document.getElementById('tyTxt').focus();
    document.getElementById('tyDone').onclick = function(){
      var txt = document.getElementById('tyTxt').value.trim();
      if (!txt) { alert('이야기를 써 주세요.'); return; }
      T.pending = txt; T.audioBlob = null;
      saveTalk(document.getElementById('tyWhen').value.trim() || null);
    };
    document.getElementById('tyCancel').onclick = function(){ T.typed = false; talkIdle(); };
  }

  function startTalk(question){
    if (!makeRec(true)) { startTyping(question); return; }
    T.typed = false;
    T.question = question || '';
    T.finalText = ''; T.chunks = []; T.audioBlob = null;
    renderFeed();
    var scr = document.getElementById('scr');
    scr.innerHTML =
      (question ? '<div class="qbox">❓ ' + esc(question) + '</div>' : '') +
      '<div class="status pulse">🔴 듣고 있어요...</div>' +
      '<div class="transcript" id="tTxt"></div>' +
      '<button class="bigbtn red" id="tDone">✅ 다 했어요</button>' +
      '<div class="row"><button class="btn" id="tEdit" style="flex:1; padding:14px;">✏️ 글로 고치기</button>' +
      '<button class="btn" id="tCancel" style="flex:1; padding:14px;">그만두기</button></div>';
    document.getElementById('tDone').onclick = askPeriod;
    document.getElementById('tEdit').onclick = editTranscript;
    document.getElementById('tCancel').onclick = function(){ talkIdle(); };
    keepAwake();
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
        T.media = stream;
        try {
          T.recorder = new MediaRecorder(stream);
          T.recorder.ondataavailable = function(ev){ if (ev.data && ev.data.size) T.chunks.push(ev.data); };
          T.recorder.onstop = function(){ if (T.chunks.length) T.audioBlob = new Blob(T.chunks, { type: 'audio/webm' }); };
          T.recorder.start(1000);
        } catch(e){}
      }).catch(function(){});
    }
    var intro = question ? question + ' 천천히 편하게 말씀해 주세요.' : '네, 듣고 있어요. 편하게 이야기해 주세요. 다 하시면 빨간 단추를 눌러 주세요.';
    T.state = 'listening';
    speak(intro, function(){ beginTalkRec(); });
  }

  function beginTalkRec(){
    if (T.state !== 'listening') return;
    T.rec = makeRec(true);
    if (!T.rec) return;
    T.rec.onresult = function(ev){
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) T.finalText += t + ' '; else interim += t;
      }
      var el = document.getElementById('tTxt'); if (!el) return;
      el.innerHTML = '';
      el.appendChild(document.createTextNode(T.finalText));
      var sp = document.createElement('span'); sp.className = 'interim';
      sp.appendChild(document.createTextNode(interim)); el.appendChild(sp);
      el.scrollTop = el.scrollHeight;
    };
    T.rec.onerror = function(ev){
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        talkIdle(); speak('마이크 사용을 허용해 주셔야 합니다. 화면에 허용 창이 나오면 허용을 눌러 주세요.');
      }
    };
    T.rec.onend = function(){ if (T.state === 'listening') { try { beginTalkRec(); } catch(e){} } };
    try { T.rec.start(); } catch(e){}
  }

  function editTranscript(){
    if (T.state !== 'listening') return;
    if (T.rec) { try { T.rec.onend = null; T.rec.stop(); } catch(e){} T.rec = null; }
    T.state = 'editing';
    stopSpeak();
    var scr = document.getElementById('scr');
    scr.innerHTML =
      (T.question ? '<div class="qbox">❓ ' + esc(T.question) + '</div>' : '') +
      '<div class="status">✏️ 고쳐 쓰세요</div>' +
      '<textarea class="bigedit" id="edTxt"></textarea>' +
      '<button class="bigbtn green midbtn" id="edResume">🎤 이어서 말하기</button>' +
      '<button class="bigbtn red" id="edDone">✅ 다 했어요</button>' +
      '<button class="bigbtn gray midbtn" id="edCancel">그만두기</button>';
    var ta = document.getElementById('edTxt');
    ta.value = T.finalText.trim();
    ta.focus();
    document.getElementById('edResume').onclick = function(){
      T.finalText = ta.value.trim() ? ta.value.trim() + ' ' : '';
      resumeListening();
    };
    document.getElementById('edDone').onclick = function(){
      T.finalText = ta.value;
      askPeriod();
    };
    document.getElementById('edCancel').onclick = function(){ talkIdle(); };
  }

  function resumeListening(){
    var scr = document.getElementById('scr');
    scr.innerHTML =
      (T.question ? '<div class="qbox">❓ ' + esc(T.question) + '</div>' : '') +
      '<div class="status pulse">🔴 듣고 있어요...</div>' +
      '<div class="transcript" id="tTxt">' + esc(T.finalText) + '</div>' +
      '<button class="bigbtn red" id="tDone">✅ 다 했어요</button>' +
      '<div class="row"><button class="btn" id="tEdit" style="flex:1; padding:14px;">✏️ 글로 고치기</button>' +
      '<button class="btn" id="tCancel" style="flex:1; padding:14px;">그만두기</button></div>';
    document.getElementById('tDone').onclick = askPeriod;
    document.getElementById('tEdit').onclick = editTranscript;
    document.getElementById('tCancel').onclick = function(){ talkIdle(); };
    T.state = 'listening';
    beginTalkRec();
  }

  function askPeriod(){
    if (T.rec) { try { T.rec.onend = null; T.rec.stop(); } catch(e){} T.rec = null; }
    if (T.recorder && T.recorder.state !== 'inactive') { try { T.recorder.stop(); } catch(e){} }
    T.pending = T.finalText.trim();
    if (!T.pending) { talkIdle(); speak('이야기가 들리지 않았어요. 다시 한 번 초록 단추를 누르고 말씀해 주세요.'); return; }
    T.state = 'period'; T.periodTries = 0;
    var scr = document.getElementById('scr');
    scr.innerHTML =
      '<div class="status">언제쯤 일인가요?</div>' +
      '<div class="qbox">몇 년도인지, 몇 살 때인지<br>말씀해 주세요</div>' +
      '<div class="status pulse">🔴 듣고 있어요...</div>' +
      '<div class="transcript" id="pTxt" style="min-height:7vh;"></div>' +
      '<input class="biginput" id="pType" placeholder="⌨️ 타자로 입력 (예: 1965년)">' +
      '<div class="row"><button class="btn" id="pOk" style="flex:1; padding:14px;">확인</button>' +
      '<button class="btn" id="pSkip" style="flex:1; padding:14px;">잘 모르겠어요</button></div>';
    document.getElementById('pSkip').onclick = function(){ if (T.state === 'period') saveTalk(null); };
    document.getElementById('pOk').onclick = function(){
      if (T.state !== 'period') return;
      var v = document.getElementById('pType').value.trim();
      saveTalk(v || null);
    };
    speak('잘 들었습니다. 방금 이야기는 언제쯤 있었던 일인가요? 몇 년도인지, 아니면 몇 살 때쯤인지 말씀해 주세요.', function(){ beginPeriodRec(); });
  }

  function beginPeriodRec(){
    if (T.state !== 'period') return;
    T.rec = makeRec(false);
    if (!T.rec) return;
    var got = '';
    T.rec.onresult = function(ev){
      for (var i = 0; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) got += ev.results[i][0].transcript + ' ';
        else { var el = document.getElementById('pTxt'); if (el) el.textContent = ev.results[i][0].transcript; }
      }
      if (got.trim()) { var el2 = document.getElementById('pTxt'); if (el2) el2.textContent = got.trim(); }
    };
    T.rec.onerror = function(){};
    T.rec.onend = function(){
      if (T.state !== 'period') return;
      var typedV = document.getElementById('pType');
      if (typedV && typedV.value.trim()) return;
      var t = got.trim();
      if (t) saveTalk(t);
      else if (T.periodTries < 1) { T.periodTries++; speak('언제쯤 일인지 한 번만 더 말씀해 주세요. 잘 모르시면 아래 단추를 눌러 주세요.', function(){ beginPeriodRec(); }); }
    };
    try { T.rec.start(); } catch(e){}
  }

  function saveTalk(periodText){
    if (T.rec) { try { T.rec.onend = null; T.rec.stop(); } catch(e){} T.rec = null; }
    T.state = 'saving';
    // push to conversation feed right away
    if (T.question) T.log.push({ role: 'q', text: T.question });
    T.log.push({ role: 'a', text: T.pending });
    T.thinking = true;
    renderFeed();
    var scr = document.getElementById('scr');
    scr.innerHTML = '<div class="status" style="padding-top:2vh;">💾 소중히 저장하고 있어요...</div>';
    post('/stories', T.pid, { project_id: T.pid, question: T.question || undefined, answer_raw: T.pending, period_text: periodText || '' })
      .then(function(r){
        if (!r.story) {
          if (r.error && r.error.indexOf('코드') > -1) { askCode(T.pid); }
          T.thinking = false; talkIdle(); speak('저장 중에 문제가 생겼습니다. 잠시 후 다시 말씀해 주세요.'); return;
        }
        var sid = r.story.id;
        if (T.audioBlob && T.audioBlob.size > 500) {
          fetch(withCode('/audio?story_id=' + sid, T.pid), { method: 'POST', headers: { 'Content-Type': 'audio/webm' }, body: T.audioBlob }).catch(function(){});
        }
        if (T.question) T.asked.push(T.question);
        if (!T.typed) speak((periodText ? periodText + ' 이야기, ' : '이야기를 ') + '잘 담았습니다. 다음 질문을 생각하고 있어요.');
        post('/interview/next', T.pid, { project_id: T.pid, question: T.question, answer: T.pending, recent: T.asked })
          .then(function(n){ offerFollowUp(n.question || null); })
          .catch(function(){ offerFollowUp(null); });
      })
      .catch(function(){ T.thinking = false; renderFeed(); talkIdle(); speak('인터넷 연결이 좋지 않아 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'); });
  }

  function offerFollowUp(q){
    if (T.state !== 'saving') return;
    T.thinking = false; renderFeed();
    var scr = document.getElementById('scr'); if (!scr) return;
    if (!q) { T.typed = false; talkIdle('✅ 잘 담았어요!'); return; }
    T.state = 'offer';
    var wasTyped = T.typed; T.typed = false;
    scr.innerHTML =
      '<div class="qbox">❓ ' + esc(q) + '</div>' +
      '<button class="bigbtn green" id="fYes">🎤 말로<br>대답하기</button>' +
      '<button class="bigbtn blue midbtn" id="fType">⌨️ 글로 대답하기</button>' +
      '<button class="bigbtn gray midbtn" id="fNo">오늘은 그만할래요</button>';
    document.getElementById('fYes').onclick = function(){ startTalk(q); };
    document.getElementById('fType').onclick = function(){ startTyping(q); };
    document.getElementById('fNo').onclick = function(){ talkIdle(); speak('오늘도 좋은 이야기 감사합니다. 편히 쉬세요.'); };
    if (!wasTyped) speak('이어서 하나만 더 여쭤볼까요? ' + q);
  }

  // ---------------- project (family) ----------------
  var P = { data: null };

  function renderProject(pid){
    if (!getCode(pid)) { if (askCode(pid) === null) { location.hash = '#home'; return; } }
    app.innerHTML = '<h1>📚 기록 관리</h1><div id="pBody"><div class="notice">불러오는 중...</div></div>' +
      '<div class="homebtn no-print"><button onclick="location.hash=\'#home\'">처음으로</button></div>';
    get('/project?id=' + pid, pid).then(function(r){
      if (!r.project) {
        if (r.error && r.error.indexOf('코드') > -1) {
          if (askCode(pid) !== null) return renderProject(pid);
        }
        document.getElementById('pBody').innerHTML = '<div class="notice">' + esc(r.error || '찾을 수 없습니다.') + '</div>';
        return;
      }
      P.data = r; P.data.pid = pid;
      drawProject();
    });
  }

  function drawProject(){
    var r = P.data; var pid = r.pid;
    var el = document.getElementById('pBody'); if (!el) return;
    var html =
      '<div class="card"><h3>📖 ' + esc(r.project.title) + '</h3>' +
      '<div class="row" style="margin-top:8px;">' +
      '<button class="btn primary" onclick="location.hash=\'#talk/' + pid + '\'">🎙 인터뷰 시작</button>' +
      '<button class="btn" onclick="location.hash=\'#book/' + pid + '\'">📕 웹책 보기</button>' +
      '</div></div>';
    var byChapter = {};
    (r.stories || []).forEach(function(s){ var k = s.chapter_id || 'none'; (byChapter[k] = byChapter[k] || []).push(s); });
    var groups = r.chapters.slice();
    groups.push({ id: 'none', title: '아직 분류 안 된 이야기' });
    groups.forEach(function(ch, gi){
      var list = byChapter[ch.id] || [];
      if (ch.id === 'none' && !list.length) return;
      html += '<div class="chapter-head"><b>' + esc(ch.title) + '</b><span>(' + list.length + '편)</span>';
      if (ch.id !== 'none') {
        html += '<button class="btn small" data-chact="rename" data-id="' + ch.id + '">✏️</button>';
        if (gi > 0) html += '<button class="btn small" data-chact="up" data-id="' + ch.id + '">▲</button>';
        if (gi < r.chapters.length - 1) html += '<button class="btn small" data-chact="down" data-id="' + ch.id + '">▼</button>';
      }
      html += '</div>';
      list.sort(function(a,b){ return (a.parsed_year || 9998) - (b.parsed_year || 9998); });
      list.forEach(function(s){ html += storyHtml(s, r.chapters, r.photos || {}); });
      if (!list.length) html += '<div style="color:#9a7053; font-size:0.9rem; padding:8px 0;">아직 이야기가 없습니다.</div>';
    });
    html += '<div style="padding:14px 0;"><button class="btn" id="chAdd">➕ 챕터 추가</button></div>';
    el.innerHTML = html;
    el.querySelectorAll('[data-act]').forEach(function(b){ b.onclick = function(){ storyAction(b.dataset.act, b.dataset.id, b); }; });
    el.querySelectorAll('[data-chact]').forEach(function(b){ b.onclick = function(){ chapterAction(b.dataset.chact, b.dataset.id); }; });
    el.querySelectorAll('select[data-move]').forEach(function(sel){
      sel.onchange = function(){
        patch('/stories?id=' + sel.dataset.move, pid, { chapter_id: sel.value || null }).then(function(){ renderProject(pid); });
      };
    });
    el.querySelectorAll('input[data-photo]').forEach(function(inp){
      inp.onchange = function(){
        if (!inp.files || !inp.files[0]) return;
        shrink(inp.files[0], function(blob){
          fetch(withCode('/photo?story_id=' + inp.dataset.photo, pid), { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob })
            .then(function(){ renderProject(pid); });
        });
      };
    });
    var chAdd = document.getElementById('chAdd');
    if (chAdd) chAdd.onclick = function(){
      var t = prompt('새 챕터 이름을 입력하세요 (예: 나의 취미)');
      if (!t || !t.trim()) return;
      post('/chapters', pid, { project_id: pid, title: t.trim() }).then(function(){ renderProject(pid); });
    };
  }

  function shrink(file, cb){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var s = Math.min(1, 1600 / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function(b){ cb(b || file); }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ cb(file); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function chapterAction(act, id){
    var pid = P.data.pid;
    var chs = P.data.chapters;
    var idx = -1; chs.forEach(function(c, i){ if (c.id === id) idx = i; });
    if (act === 'rename') {
      var cur = idx > -1 ? chs[idx].title : '';
      var t = prompt('챕터 이름', cur);
      if (!t || !t.trim()) return;
      patch('/chapters?id=' + id, pid, { title: t.trim() }).then(function(){ renderProject(pid); });
    } else if (act === 'up' || act === 'down') {
      var j = act === 'up' ? idx - 1 : idx + 1;
      if (idx < 0 || j < 0 || j >= chs.length) return;
      var a = chs[idx], b = chs[j];
      patch('/chapters?id=' + a.id, pid, { sort: b.sort }).then(function(){
        return patch('/chapters?id=' + b.id, pid, { sort: a.sort });
      }).then(function(){ renderProject(pid); });
    }
  }

  function storyHtml(s, chapters, photosMap){
    var pid = P.data.pid;
    var showPolished = s.polish_approved && s.answer_polished;
    var opts = '<option value="">챕터 이동...</option>' + chapters.map(function(c){
      return '<option value="' + c.id + '"' + (c.id === s.chapter_id ? ' selected' : '') + '>' + esc(c.title) + '</option>';
    }).join('');
    var phs = (photosMap[s.id] || []).map(function(ph){
      return '<div class="ph"><img src="' + esc(ph.url) + '"><button data-act="delph" data-id="' + ph.id + '">✕</button></div>';
    }).join('');
    return '<div class="story" id="st-' + s.id + '">' +
      (s.question ? '<div class="q">❓ ' + esc(s.question) + '</div>' : '') +
      '<div class="period">🕰 ' + esc(s.period_text || '시기 미상') + (s.parsed_year ? ' · ' + s.parsed_year + '년 무렵' : '') + ' · 기록 ' + new Date(s.created_at).toLocaleDateString('ko-KR') + '</div>' +
      (showPolished ? '<span class="polished-tag">✨ 다듬은 글 (승인됨)</span>' : '') +
      '<div class="txt">' + esc(showPolished ? s.answer_polished : s.answer_raw) + '</div>' +
      (phs ? '<div class="phrow">' + phs + '</div>' : '') +
      (s.audio_path ? '<audio controls preload="none" src="' + withCode('/audio?story_id=' + s.id, pid) + '"></audio>' : '') +
      '<div class="row" style="margin-top:10px;">' +
        '<button class="btn" data-act="polish" data-id="' + s.id + '">✨ AI로 다듬기</button>' +
        '<label class="btn" style="cursor:pointer;">📷 사진<input type="file" accept="image/*" data-photo="' + s.id + '" style="display:none;"></label>' +
        '<button class="btn" data-act="period" data-id="' + s.id + '">시기 수정</button>' +
        '<select style="width:auto;" data-move="' + s.id + '">' + opts + '</select>' +
        '<button class="btn warn" data-act="del" data-id="' + s.id + '">삭제</button>' +
      '</div><div class="compare-slot"></div></div>';
  }

  function storyAction(act, id, btn){
    var pid = P.data.pid;
    if (act === 'del') {
      if (!confirm('이 이야기를 정말 삭제할까요? 음성·사진 기록도 함께 삭제됩니다.')) return;
      del('/stories?id=' + id, pid).then(function(){ renderProject(pid); });
    } else if (act === 'delph') {
      if (!confirm('이 사진을 삭제할까요?')) return;
      del('/photo?id=' + id, pid).then(function(){ renderProject(pid); });
    } else if (act === 'period') {
      var cur = '';
      P.data.stories.forEach(function(s){ if (s.id === id && s.period_text) cur = s.period_text; });
      var np = prompt('시기를 입력하세요 (예: 1965년, 열두 살 때, 군대 시절)', cur);
      if (np === null) return;
      patch('/stories?id=' + id, pid, { period_text: np }).then(function(){ renderProject(pid); });
    } else if (act === 'polish') {
      btn.disabled = true; btn.textContent = '✨ 다듬는 중...';
      post('/polish', pid, { story_id: id }).then(function(r){
        btn.disabled = false; btn.textContent = '✨ AI로 다듬기';
        if (!r.polished) { alert(r.error || '다듬기에 실패했습니다.'); return; }
        var slot = document.querySelector('#st-' + id + ' .compare-slot');
        slot.innerHTML =
          '<div class="compare">' +
          '<div class="pane"><b>말씀하신 원문 (그대로 보존)</b>' + esc(r.raw) + '</div>' +
          '<div class="pane polish"><b>✨ AI가 다듬은 글 (자유롭게 고치세요)</b><textarea id="ed-' + id + '" style="border:none; background:transparent; padding:0; min-height:140px; width:100%;">' + esc(r.polished) + '</textarea></div>' +
          '</div><div class="row" style="margin-top:8px;">' +
          '<button class="btn primary" id="ok-' + id + '">✔ 이 글로 승인</button>' +
          '<button class="btn" id="no-' + id + '">닫기</button></div>';
        document.getElementById('ok-' + id).onclick = function(){
          post('/approve', pid, { story_id: id, approved: true, text: document.getElementById('ed-' + id).value })
            .then(function(){ renderProject(pid); });
        };
        document.getElementById('no-' + id).onclick = function(){ slot.innerHTML = ''; };
      });
    }
  }

  // ---------------- book ----------------
  function renderBook(pid){
    if (!getCode(pid)) { if (askCode(pid) === null) { location.hash = '#home'; return; } }
    app.innerHTML = '<div id="bBody"><div class="notice">책을 준비하는 중...</div></div>' +
      '<div class="row no-print" style="justify-content:center; padding:10px;">' +
      '<button class="btn primary" onclick="window.print()">🖨 PDF로 저장 / 인쇄</button>' +
      '<button class="btn" onclick="location.hash=\'#order/' + pid + '\'">🎁 책 주문하기</button>' +
      '<button class="btn" id="bShare">📤 공유</button>' +
      '<button class="btn" id="bRead">🔊 읽어주기</button>' +
      '<button class="btn" id="bStop">멈춤</button>' +
      '<button class="btn" onclick="location.hash=\'#p/' + pid + '\'">← 돌아가기</button></div>';
    get('/project?id=' + pid, pid).then(function(r){
      if (!r.project) {
        if (r.error && r.error.indexOf('코드') > -1 && askCode(pid) !== null) return renderBook(pid);
        return;
      }
      var code = getCode(pid);
      var photosMap = r.photos || {};
      var byChapter = {};
      (r.stories || []).forEach(function(s){ var k = s.chapter_id || 'none'; (byChapter[k] = byChapter[k] || []).push(s); });
      var groups = r.chapters.slice(); groups.push({ id: 'none', title: '그 밖의 이야기' });
      var today = new Date();
      var html = '<div class="book"><div class="cover"><h2>' + esc(r.project.title) + '</h2>' +
        '<p>' + (r.project.subject_name ? esc(r.project.subject_name) + (r.project.birth_year ? ' · ' + r.project.birth_year + '년생' : '') : '') + '</p>' +
        '<p style="font-size:0.85rem;">메모텔라가 함께 엮은 인생책</p></div>';
      if (r.project.family_info) html += '<h3>우리 가족</h3><div class="family">' + esc(r.project.family_info) + '</div>';
      var tocRows = '';
      groups.forEach(function(ch){
        var n = (byChapter[ch.id] || []).length;
        if (n) tocRows += '<div><span>' + esc(ch.title) + '</span><span>' + n + '편</span></div>';
      });
      if (tocRows) html += '<h3>목차</h3><div class="toc">' + tocRows + '</div>';
      var readParts = [r.project.title];
      var qrJobs = [];
      groups.forEach(function(ch){
        var list = byChapter[ch.id] || [];
        if (!list.length) return;
        list.sort(function(a,b){ return (a.parsed_year || 9998) - (b.parsed_year || 9998); });
        html += '<h3>' + esc(ch.title) + '</h3>';
        readParts.push(ch.title);
        list.forEach(function(s){
          var body = (s.polish_approved && s.answer_polished) ? s.answer_polished : s.answer_raw;
          html += '<div class="piece">';
          if (s.audio_path) {
            html += '<div class="qrbox"><div id="qr-' + s.id + '"></div><span>📱 목소리 듣기</span></div>';
            qrJobs.push(s.id);
          }
          if (s.period_text) html += '<div class="when">' + esc(s.period_text) + '</div>';
          html += '<div class="body">' + esc(body) + '</div>';
          (photosMap[s.id] || []).forEach(function(ph){ html += '<img src="' + esc(ph.url) + '">'; });
          html += '</div>';
          readParts.push(body);
        });
      });
      html += '<div class="colophon">「' + esc(r.project.title) + '」<br>' +
        (r.project.subject_name ? esc(r.project.subject_name) + ' 구술 · 가족 엮음<br>' : '') +
        today.getFullYear() + '년 ' + (today.getMonth()+1) + '월 ' + today.getDate() + '일 만듦<br>🪶 메모텔라 — 말하면, 한 권의 인생이 됩니다</div>';
      html += '</div>';
      document.getElementById('bBody').innerHTML = html;
      if (window.QRCode) {
        var base = location.origin + location.pathname;
        qrJobs.forEach(function(sid){
          var el = document.getElementById('qr-' + sid);
          if (el) new QRCode(el, { text: base + '#listen/' + sid + '/' + code, width: 74, height: 74, correctLevel: QRCode.CorrectLevel.M });
        });
      }
      document.getElementById('bRead').onclick = function(){
        stopSpeak();
        readParts.forEach(function(t){ var u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 0.92; window.speechSynthesis.speak(u); });
      };
      document.getElementById('bStop').onclick = stopSpeak;
      var bs = document.getElementById('bShare');
      if (bs) bs.onclick = function(){ shareApp(r.project.title, r.project.title + ' — 메모텔라 인생책'); };
    });
  }

  // ---------------- listen (QR target) ----------------
  function renderListen(sid, code){
    app.innerHTML =
      '<h1>🔊 목소리 듣기</h1>' +
      '<div class="card" style="text-align:center;">' +
      '<p style="margin-bottom:10px;">재생 단추를 눌러 주세요</p>' +
      '<audio controls style="width:100%;" src="' + API + '/audio?story_id=' + esc(sid) + '&code=' + encodeURIComponent(code) + '"></audio></div>' +
      '<div class="homebtn"><button onclick="location.hash=\'#home\'">메모텔라 처음으로</button></div>';
  }

  // ---- PWA: register service worker + reminders ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  maybeRemind();

  route();
})();
</script>
